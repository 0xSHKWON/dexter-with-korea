name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Weekly KR-eval regression sweep (Mon 06:00 KST) — catches drift between merges.
    - cron: '0 21 * * 0'

jobs:
  checks:
    if: github.event.action != 'labeled' || github.event.label.name == 'run-ci'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: typecheck
            command: bun run typecheck
          - task: test
            command: bun test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run ${{ matrix.task }}
        run: ${{ matrix.command }}

  # KR-eval regression run (replay mode — recorded tool fixtures, no DART/KRX/Naver network;
  # LLM keys for agent + judge come from repo secrets). This is the ONLY gate that measures
  # answer quality, so it runs on the default path — every main push + a weekly cron — not
  # just on demand; PRs can still opt in with the `run-eval` label (fork PRs can't read
  # secrets, so a PR-default run would always no-op there). KR_EVAL_REQUIRE_RUN makes an
  # all-skip run (missing keys/fixtures) FAIL instead of showing a silent green.
  #
  # MAINTENANCE: fixtures are verbatim recorded tool outputs — whenever a tool's OUTPUT
  # SHAPE changes (new fields the skills/prompts instruct the agent to read), re-record
  # with `bun run kr-eval:record` in a keyed environment, or replay answers will hedge on
  # missing fields and judge scores will drift.
  kr-eval-replay:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'run-eval')
    runs-on: ubuntu-latest
    # Rapid successive merges: only the newest main run carries signal — cancel superseded ones.
    concurrency:
      group: kr-eval-replay-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: KR eval (replay)
        run: bun run kr-eval:replay
        env:
          KR_EVAL_REQUIRE_RUN: '1'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          # Optional repo variables to pin models to whatever key is configured
          # (defaults: agent + judge = gpt-5.5, which needs OPENAI_API_KEY).
          KR_RUNNER_MODEL: ${{ vars.KR_RUNNER_MODEL }}
          KR_EVAL_JUDGE_MODEL: ${{ vars.KR_EVAL_JUDGE_MODEL }}
