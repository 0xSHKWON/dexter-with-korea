name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  checks:
    if: github.event.action != 'labeled' || github.event.label.name == 'run-ci'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: typecheck
            command: bun run typecheck
          - task: test
            command: bun test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run ${{ matrix.task }}
        run: ${{ matrix.command }}

  # KR-eval regression run (replay mode — recorded tool fixtures, no DART/KRX/Naver network;
  # LLM keys for agent + judge come from repo secrets). This is OPT-IN: it runs only when a
  # PR carries the `run-eval` label, NOT on every main push. Rationale: agent + judge are
  # live LLM calls (token cost per run), and KR_EVAL_REQUIRE_RUN makes a keyless run FAIL —
  # so gating main pushes on it would turn main red until OPENAI_API_KEY (etc.) is set as a
  # repo secret. Keeping it label-only keeps main green with zero token cost by default.
  # To re-enable an always-on gate once secrets are configured: add `github.event_name ==
  # 'push'` (and restore the weekly `schedule` cron in `on:`) to the condition below.
  #
  # MAINTENANCE: fixtures are verbatim recorded tool outputs — whenever a tool's OUTPUT
  # SHAPE changes (new fields the skills/prompts instruct the agent to read), re-record
  # with `bun run kr-eval:record` in a keyed environment, or replay answers will hedge on
  # missing fields and judge scores will drift.
  kr-eval-replay:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'run-eval'
    runs-on: ubuntu-latest
    # Rapid successive merges: only the newest main run carries signal — cancel superseded ones.
    concurrency:
      group: kr-eval-replay-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: KR eval (replay)
        run: bun run kr-eval:replay
        env:
          KR_EVAL_REQUIRE_RUN: '1'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          # Optional repo variables to pin models to whatever key is configured
          # (defaults: agent + judge = gpt-5.5, which needs OPENAI_API_KEY).
          KR_RUNNER_MODEL: ${{ vars.KR_RUNNER_MODEL }}
          KR_EVAL_JUDGE_MODEL: ${{ vars.KR_EVAL_JUDGE_MODEL }}
